{% extends "base.html" %}

{% block title %}
AI Assistant
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <i class="bi bi-robot text-success"
           style="font-size:80px;">
        </i>

        <h1 class="fw-bold">
            FreshMart AI Assistant
        </h1>

        <p class="text-muted">
            Ask for grocery recommendations,
            diet plans and healthy foods.
        </p>

    </div>

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <textarea
                            name="question"
                            rows="4"
                            class="form-control mb-3"
                            placeholder="Example: Suggest foods for weight loss"
                            required
                        ></textarea>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Ask Assistant
                        </button>

                    </form>

                </div>

            </div>

            {% if answer %}

            <div class="card shadow border-0 mt-4">

                <div class="card-body">

                    <h4 class="text-success">
                        AI Response
                    </h4>

                    <hr>

                    <pre style="white-space:pre-wrap;border:none;background:none;">
{{ answer }}
                    </pre>

                </div>

            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
