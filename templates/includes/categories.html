<section class="py-5">

<div class="container">

<div class="d-flex justify-content-between mb-4">

<h2 class="fw-bold">

Shop by Category

</h2>

<a href="{% url 'categories:index' %}"
class="btn btn-success">

View All

</a>

</div>

<div class="row">

{% for category in categories %}

<div class="col-lg-2 col-md-3 col-6 mb-4">

<a
href="{% url 'products:index' %}?category={{ category.slug }}"
class="text-decoration-none">

<div class="card border-0 shadow-sm text-center p-3 h-100">

{% if category.image %}

<img
src="{{ category.image.url }}"
style="height:90px;width:90px;object-fit:cover;border-radius:50%;margin:auto;">

{% endif %}

<h6 class="mt-3 text-dark">

{{ category.name }}

</h6>

</div>

</a>

</div>

{% endfor %}

</div>

</div>

</section>
