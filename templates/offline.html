{% extends "base.html" %}

{% block title %}You are Offline | Om Super Mart{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="mx-auto my-5 p-4 rounded-4 shadow-sm bg-white" style="max-width: 520px;">
        <div class="display-1 mb-3">📶</div>
        <h3 class="fw-bold text-dark mb-2">You Are Currently Offline</h3>
        <p class="text-muted mb-4">
            It looks like your internet connection is unavailable. Reconnect to browse fresh items, check live stock, and place 10-minute orders!
        </p>
        <button type="button" class="btn btn-success btn-lg rounded-pill px-4 fw-bold shadow-sm" onclick="window.location.reload();">
            <i class="bi bi-arrow-clockwise me-1"></i> Check Connection &amp; Reload
        </button>
    </div>
</div>
{% endblock %}
