<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) | FreshMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top right, #f0fdf4 0%, #ffffff 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            padding: 24px;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(22, 101, 52, 0.12), 0 0 0 1px rgba(22, 101, 52, 0.08);
            padding: 40px 32px;
            text-align: center;
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #f0fdf4;
            color: #16a34a;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        .display-font {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 700;
            color: #0f172a;
        }
        .btn-primary-fresh {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-weight: 700;
            border-radius: 999px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary-fresh:hover {
            background: #15803d;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px -4px rgba(22, 163, 74, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-badge">
            <i class="bi bi-search"></i> Error 404
        </div>
        <div class="mb-3 fs-1">🛒 🔍</div>
        <h2 class="display-font mb-2">Item or Page Not Found</h2>
        <p class="text-muted mb-4" style="line-height: 1.6;">
            The aisle or page you're looking for doesn't exist or may have been moved. Let's get you back to the freshest aisles!
        </p>
        <div class="d-flex justify-content-center">
            <a href="/" class="btn-primary-fresh">
                <i class="bi bi-house-door-fill"></i> Go to Homepage
            </a>
        </div>
    </div>
</body>
</html>
